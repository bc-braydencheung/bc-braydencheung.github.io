<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brayden Cheung — App 開發者</title>
<meta name="description" content="Brayden Cheung 開發的香港實用 App：在途 EnRoute、瞬更 ShiftNow。">
<style>
  :root { --brand:#2563EB; --ink:#1F2933; --muted:#52606D; --border:#E4E7EB; --canvas:#F7F8FA; --surface:#FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --brand:#60A5FA; --ink:#E5E7EB; --muted:#9CA3AF; --border:#2D3748; --canvas:#0F172A; --surface:#1E293B; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:48px 20px 32px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 32px; }
  h2 { font-size:15px; color:var(--muted); font-weight:600; margin:32px 0 12px; }
  .card { display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:16px; margin-bottom:12px; text-decoration:none; color:inherit; }
  a.card:hover { border-color:var(--brand); }
  .card img { width:56px; height:56px; border-radius:14px; flex:none; }
  .card b { display:block; font-size:17px; }
  .card span { color:var(--muted); font-size:14px; }
  .tag { display:inline-block; font-size:12px; color:var(--brand); border:1px solid var(--brand); border-radius:999px; padding:0 8px; margin-top:4px; }
  .btn { display:block; text-align:center; background:var(--brand); color:#fff; text-decoration:none; font-weight:600;
    border-radius:12px; padding:12px; margin-top:16px; }
  ul { padding-left:20px; margin:0; }
  li { margin:6px 0; }
  a { color:var(--brand); }
  footer { color:var(--muted); font-size:13px; text-align:center; padding:24px 20px 40px; }
</style>
</head>
<body>
<main>
  <h1>Brayden Cheung</h1>
  <p class="lead">為香港人而做的實用 App，簡單、好用、尊重私隱。</p>

  <h2>App</h2>
  <a class="card" href="https://play.google.com/store/apps/details?id=com.enroute.hkbus">
    <img src="enroute.png" alt="在途 EnRoute 圖示">
    <div><b>在途 EnRoute</b><span>香港巴士、港鐵到站時間一目了然</span></div>
  </a>
  <div class="card">
    <img src="shiftnow.png" alt="瞬更 ShiftNow 圖示">
    <div><b>瞬更 ShiftNow</b><span>車長更表及換更，一部手機處理妥當</span><br><span class="tag">即將推出</span></div>
  </div>
  <a class="btn" href="https://play.google.com/store/apps/developer?id=Brayden+Cheung">在 Google Play 查看全部</a>

  <h2>私隱及資料</h2>
  <ul>
    <li><a href="https://bc-braydencheung.github.io/enroute-privacy/">在途 EnRoute 私隱政策</a></li>
    <li><a href="https://bc-braydencheung.github.io/enroute-privacy/delete/">在途 EnRoute 刪除帳戶及資料</a></li>
    <li><a href="https://bc-braydencheung.github.io/enroute-privacy/shiftnow/">瞬更 ShiftNow 私隱政策</a></li>
  </ul>

  <h2>聯絡</h2>
  <p>電郵：<a href="mailto:bc.braydencheung@gmail.com">bc.braydencheung@gmail.com</a></p>
</main>
<footer>© 2026 Brayden Cheung</footer>
</body>
</html>
